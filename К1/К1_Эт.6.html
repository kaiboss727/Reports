// ── Состояние наладки (чек-офф + замечания), хранится локально на телефоне ──
// Ключ устройства = адрес (стабилен между перегенерациями файла), иначе id.
// localStorage best-effort: если недоступен (file:// на части браузеров) —
// прогресс живёт в текущей сессии, а durable-выход = «Экспорт».
const FLOOR = "К1_Эт.6";
const STORE_KEY = 'fsviewer:' + FLOOR;
let STATE = (function(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; } })();
if(!STATE.done) STATE.done = {};
if(!STATE.note) STATE.note = {};
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch(e){} }
function devKey(d){ return d.addr ? ('@'+d.addr) : ('#'+d.id); }

const svg = document.getElementById('stage');
const wrap = document.getElementById('stagewrap');
const pulseG = document.getElementById('pulseG');
let vb = {...HOME};

function applyVB(){ svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h); }
applyVB();

// client px → svg координаты
function toSvg(cx, cy){
  const r = svg.getBoundingClientRect();
  return { x: vb.x + (cx - r.left)/r.width * vb.w,
           y: vb.y + (cy - r.top)/r.height * vb.h };
}
function clampScale(w){ // не зумить уже HOME.w*0.01 и не дальше HOME.w*4
  return Math.min(Math.max(w, HOME.w*0.01), HOME.w*4);
}
function zoomAt(px, py, factor){
  let nw = clampScale(vb.w*factor); factor = nw/vb.w;
  vb.x = px - (px - vb.x)*factor;
  vb.y = py - (py - vb.y)*factor;
  vb.w = nw; vb.h *= factor;
  applyVB();
  // Человек в режиме обхода поменял масштаб — запоминаем ЕГО (см. focusDevice).
  if(navZoomW != null) navZoomW = vb.w;
}

// плавный переход viewBox к цели
let anim = null;
function animateTo(t, ms){
  if(anim) cancelAnimationFrame(anim);
  const s = {...vb}, t0 = performance.now();
  function step(now){
    let k = Math.min(1, (now - t0)/ms); k = 1-Math.pow(1-k,3); // ease-out
    vb.x = s.x+(t.x-s.x)*k; vb.y = s.y+(t.y-s.y)*k;
    vb.w = s.w+(t.w-s.w)*k; vb.h = s.h+(t.h-s.h)*k;
    applyVB();
    if(k<1) anim = requestAnimationFrame(step);
  }
  anim = requestAnimationFrame(step);
}

// Масштаб обхода. ПЕРВЫЙ переход к устройству приближает как раньше (человек ещё
// не сказал, какой масштаб ему удобен). Дальше правило простое: если он сам
// поменял масштаб (щипок / колесо / + −), обход держит ЕГО масштаб и только
// центрирует следующее устройство. Сброс — кнопка ⤢ «весь план»: это и есть
// выход из режима обхода, после него всё по кругу.
let navZoomW = null;

// центрировать+приблизить на устройстве
function focusDevice(d){
  let tw;
  if(navZoomW != null){ tw = clampScale(navZoomW); }
  else { tw = Math.min(HOME.w, Math.max(d.r*36, HOME.w*0.13)); navZoomW = tw; }
  const th = tw * (vb.h/vb.w);
  animateTo({x:d.x-tw/2, y:d.y-th/2, w:tw, h:th}, 350);
  // пульс
  pulseG.setAttribute('transform','translate('+d.x+','+d.y+')');
  pulseG.querySelector('.pulse').setAttribute('r', Math.max(6,d.r));
  pulseG.classList.remove('on'); void pulseG.offsetWidth; pulseG.classList.add('on');
}

function select(id){
  document.querySelectorAll('.dev.sel').forEach(e=>e.classList.remove('sel'));
  const d = byId[id]; if(!d) return;
  navIdx = ORDER.findIndex(x=>x.id===id);   // синхронизируем курсор обхода с тапом/поиском
  document.getElementById(id).classList.add('sel');
  focusDevice(d);
  showCard(d);
}

let curDev = null;   // устройство, открытое в карточке (для чек-офф/замечания)
function showCard(d){
  curDev = d;
  document.getElementById('cAddr').textContent = d.addr || '(без адреса)';
  const rows = [['Прибор', d.panel], ['Линия', d.line]];
  document.getElementById('cGrid').innerHTML = rows.filter(r=>r[1])
    .map(r=>'<div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div>').join('');
  document.getElementById('cNote').value = STATE.note[devKey(d)] || '';
  syncDoneBtn(d);
  document.getElementById('card').classList.add('show');
  // Кнопки обхода переезжают в свободное место карточки (под правый палец).
  const nb=document.getElementById('navbtns'); nb.className='incard';
  document.getElementById('card').appendChild(nb);
  relayoutNav();   // адрес другой длины -> свободное место сдвинулось
}
function syncDoneBtn(d){
  const on = !!STATE.done[devKey(d)];
  const b = document.getElementById('cDone');
  b.classList.toggle('done', on);
  b.textContent = on ? '✓ Проверено' : 'Отметить проверено';
}
document.getElementById('cardClose').onclick = ()=>{
  document.getElementById('card').classList.remove('show');
  // Кнопки обхода возвращаются вниз на план.
  const nb=document.getElementById('navbtns'); nb.className='float'; wrap.appendChild(nb);
  relayoutNav();
};

// ── Чек-офф / прогресс / замечания ────────────────────────────────
function updateProgress(){
  const total = DEVICES.length;
  let done = 0; DEVICES.forEach(d=>{ if(STATE.done[devKey(d)]) done++; });
  document.getElementById('prog').textContent = '✓ ' + done + '/' + total;
  document.getElementById('progbar').style.width = (total ? done/total*100 : 0) + '%';
}
function applyDone(){
  DEVICES.forEach(d=>{ const el=document.getElementById(d.id);
    if(el) el.classList.toggle('done', !!STATE.done[devKey(d)]); });
  updateProgress();
}
document.getElementById('cDone').onclick = ()=>{
  if(!curDev) return;
  const k = devKey(curDev);
  if(STATE.done[k]) delete STATE.done[k]; else STATE.done[k] = 1;
  saveState();
  document.getElementById(curDev.id).classList.toggle('done', !!STATE.done[k]);
  syncDoneBtn(curDev); updateProgress();
};
document.getElementById('cNote').addEventListener('input', function(){
  if(!curDev) return;
  const k = devKey(curDev);
  if(this.value.trim()) STATE.note[k] = this.value; else delete STATE.note[k];
  saveState();
});
document.getElementById('undonebtn').onclick = function(){
  const on = document.getElementById('devs').classList.toggle('hidedone');
  this.classList.toggle('on', on);
};
// Экспорт меток+замечаний одним текстовым файлом — отправить в Telegram.
document.getElementById('exportbtn').onclick = function(){
  let done = 0; DEVICES.forEach(d=>{ if(STATE.done[devKey(d)]) done++; });
  const out = ['Этаж: ' + FLOOR,
               'Сформировано: ' + new Date().toLocaleString(),
               'Проверено: ' + done + ' / ' + DEVICES.length, '',
               'адрес;тип;линия;прибор;проверено;замечание'];
  DEVICES.slice()
    .sort((a,b)=>(''+(a.addr||'')).localeCompare(''+(b.addr||''),'ru',{numeric:true}))
    .forEach(d=>{
      const k = devKey(d);
      const dn = STATE.done[k] ? 'да' : '';
      const nt = (STATE.note[k] || '').replace(/[\r\n;]+/g,' ').trim();
      if(dn || nt) out.push([d.addr||'', d.type||'', d.line||'', d.panel||'', dn, nt].join(';'));
    });
  if(out.length <= 5){ toast('Нет отметок и замечаний'); return; }
  const blob = new Blob([out.join('\r\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'наладка_' + (FLOOR||'план').replace(/[^0-9A-Za-zА-Яа-яЁё-]+/g,'_') + '.txt';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
};

let toastT=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',1800);
}

// ── Поиск по адресу ──────────────────────────────────────────────
const search = document.getElementById('search');
function normAddr(s){ return (s||'').trim().replace(/\s+/g,''); }
function findByAddr(q){
  q = normAddr(q); if(!q) return null;
  let m = DEVICES.find(d=>normAddr(d.addr)===q && !isHidden(d.id));
  if(m) return m;
  m = DEVICES.find(d=>normAddr(d.addr).endsWith(q) && !isHidden(d.id)); // частичный хвост
  return m || null;
}
function runSearch(){
  const m = findByAddr(search.value);
  if(m){ select(m.id); } else if(normAddr(search.value)){ toast('Адрес не найден'); }
}
search.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); runSearch(); search.blur(); }});
search.addEventListener('input', ()=>{ if(normAddr(search.value).length>=3) runSearch(); });
document.getElementById('gobtn').onclick = ()=>{ runSearch(); search.blur(); };

// ── Последовательный обход по адресу (◀ / ▶) ──────────────────────
// Шаг по ORDER, пропуская скрытые фильтром. Если ничего не выбрано —
// ▶ начинает с самого малого адреса, ◀ с самого большого.
function step(delta){
  if(!ORDER.length) return;
  let i = navIdx<0 ? (delta>0 ? -1 : 0) : navIdx;
  for(let n=0; n<ORDER.length; n++){
    i = (i + delta + ORDER.length) % ORDER.length;
    if(!isHidden(ORDER[i].id)){ select(ORDER[i].id); return; }
  }
}
document.getElementById('prevbtn').onclick = ()=>step(-1);
document.getElementById('nextbtn').onclick = ()=>step(1);

// ── Фильтры (тип / линия / прибор) — динамически из данных ────────
const FIELDS = [['type','Тип'],['panel_line','Прибор.линия']];
const active = {type:new Set(), panel_line:new Set()};
function buildFilters(){
  const host = document.getElementById('fgroups'); host.innerHTML='';
  FIELDS.forEach(([f,label])=>{
    const vals = [...new Set(DEVICES.map(d=>d[f]).filter(v=>v!==''&&v!=null))]
      .sort((a,b)=>(''+a).localeCompare(''+b,'ru',{numeric:true}));
    if(vals.length<=1) return; // нечего фильтровать
    vals.forEach(v=>active[f].add(v));
    const g=document.createElement('div'); g.className='fgroup';
    g.innerHTML='<h4>'+label+'</h4>';
    const chips=document.createElement('div'); chips.className='chips';
    vals.forEach(v=>{
      const c=document.createElement('span'); c.className='chip on'; c.textContent=v; c.dataset.v=v;
      c.onclick=()=>{ if(c._long){ c._long=false; return; }   // был долгий тап — обычный клик не считаем
        c.classList.toggle('on');
        if(c.classList.contains('on')) active[f].add(v); else active[f].delete(v);
        applyFilters(); };
      // Долгое нажатие (~0.6с) → «соло»: остаётся только этот тип, остальные гаснут.
      // Повторное долгое нажатие на нём же — вернуть все.
      let t=null;
      const start=()=>{ c._long=false; t=setTimeout(()=>{ c._long=true;
        soloOrAll(f, v, chips); if(navigator.vibrate) navigator.vibrate(30); }, 600); };
      const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
      c.addEventListener('pointerdown', start);
      c.addEventListener('pointerup', cancel);
      c.addEventListener('pointerleave', cancel);
      c.addEventListener('pointercancel', cancel);
      chips.appendChild(c);
    });
    g.appendChild(chips); host.appendChild(g);
  });
}
function isHidden(id){ return document.getElementById(id).classList.contains('hidden'); }
function applyFilters(){
  DEVICES.forEach(d=>{
    const el=document.getElementById(d.id);
    const ok = FIELDS.every(([f])=>{
      // если группа не строилась (≤1 значение) — не фильтруем по ней
      return active[f].size===0 ? true : (d[f]===''||d[f]==null) ? true : active[f].has(d[f]);
    });
    el.classList.toggle('hidden', !ok);
  });
}
// «Соло» по долгому тапу: если активен только v — вернуть все; иначе оставить один v.
function soloOrAll(f, v, group){
  const isSolo = active[f].size===1 && active[f].has(v);
  active[f].clear();
  if(isSolo){ group.querySelectorAll('.chip').forEach(ch=>active[f].add(ch.dataset.v)); }
  else { active[f].add(v); }
  group.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('on', active[f].has(ch.dataset.v)));
  applyFilters();
}
function buildLegend(){
  // Кол-во устройств каждого типа на плане. Каждое устройство относим к записи
  // легенды с самым ДЛИННЫМ совпадающим именем (чтобы «ИП 212/101» не утекал
  // в «ИП 212», а «АМ-4» не путался с «АМ-1»).
  const names = LEGEND.map(e=>e.name).sort((a,b)=>b.length-a.length);
  const cnt = {};
  DEVICES.forEach(d=>{ const t=d.type||''; const nm=names.find(n=>t.indexOf(n)>=0);
    if(nm) cnt[nm]=(cnt[nm]||0)+1; });
  document.getElementById('legend').innerHTML = LEGEND.map(e=>{
    const shape = e.square
      ? '<rect x="1" y="1" width="14" height="14" fill="'+e.color+'" stroke="#000"/>'
      : '<circle cx="8" cy="8" r="7" fill="'+e.color+'" stroke="#000"/>';
    return '<span class="li"><svg width="16" height="16">'+shape
      +'<text x="8" y="8" font-family="Arial" font-size="'+(e.symbol.length>1?7:9)+'" fill="'+e.symbol_fill+'" text-anchor="middle" dominant-baseline="central">'
      +e.symbol+'</text></svg>'+e.name+' — <b>'+(cnt[e.name]||0)+'</b> шт.</span>';
  }).join('');
}

// Полноэкранный режим (Chrome/Edge/Android). С webkit-фолбэком для старых.
document.getElementById('fsbtn').onclick = function(){

  if(!document.fullscreenElement && !document.webkitFullscreenElement){

  }
};

});

// ── Жесты: pan / pinch / wheel ────────────────────────────────────
const pts = new Map();
let lastDist=0, moved=false, downXY=null, downT=0;
svg.addEventListener('pointerdown', e=>{
  e.preventDefault();                 // не даём браузеру начать выделение текста при пане
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===1){ moved=false; downXY={x:e.clientX,y:e.clientY}; downT=Date.now(); }
  if(pts.size===2){ lastDist = dist2(); }
});
svg.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===1){
    const r=svg.getBoundingClientRect();
    vb.x -= (e.clientX-prev.x)/r.width*vb.w;
    vb.y -= (e.clientY-prev.y)/r.height*vb.h;
    applyVB();
    if(downXY && Math.hypot(e.clientX-downXY.x, e.clientY-downXY.y)>12) moved=true;
  } else if(pts.size===2){
    const d = dist2(); if(lastDist>0){
      const m = mid2(); const sp = toSvg(m.x, m.y);
      zoomAt(sp.x, sp.y, lastDist/d);
    }
    lastDist = d; moved=true;
  }
});
function endPtr(e){
  // тап (без панорамы): по устройству → карточка; по зоне → подсветка зоны.
  // Элемент берём по координате (elementFromPoint), а НЕ из e.target: при
  // setPointerCapture target = сам <svg>, и closest('.dev') не находил иконку.
  // elementFromPoint игнорирует подписи (pointer-events:none) и отдаёт иконку.
  if(pts.size===1 && !moved && Date.now()-downT<500){
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const g = t && t.closest ? t.closest('.dev') : null;
    if(g && !g.classList.contains('hidden')){ select(g.id); }
    else { selectZone(t && t.closest ? t.closest('.zone') : null); }
  }
  pts.delete(e.pointerId);
  if(pts.size<2) lastDist=0;
}
// Подсветка зоны тапом: контур + её состав + плашка «имя — N шт.».
// Состав ищем ГЕОМЕТРИЕЙ (центр иконки внутри контура), считаем только пожарные
// извещатели (у них заполнено zone_name). Имя зоны — самое частое среди попавших.
// Повторный тап по той же зоне снимает, тап мимо — снимает всё.
let curZone = null;
function clearZone(){
  document.querySelectorAll('.zone.zsel').forEach(el=>el.classList.remove('zsel'));
  document.querySelectorAll('.dev.zhi').forEach(el=>el.classList.remove('zhi'));
  document.getElementById('zinfo').style.display='none';
  curZone = null;
}
function ptInPoly(x, y, pts){
  let inside=false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function zoneHit(z, x, y){
  if(z.tagName.toLowerCase()==='rect'){
    const rx=+z.getAttribute('x'), ry=+z.getAttribute('y');
    return x>=rx && x<=rx+ (+z.getAttribute('width')) && y>=ry && y<=ry+ (+z.getAttribute('height'));
  }
  const pts=(z.getAttribute('points')||'').trim().split(/\s+/).map(p=>p.split(',').map(Number));
  return ptInPoly(x, y, pts);
}
function selectZone(z){
  if(!z){ clearZone(); return; }
  if(curZone===z){ clearZone(); return; }   // повторный тап по той же зоне — снять
  clearZone(); curZone = z;
  z.classList.add('zsel');
  let n=0; const names={};
  DEVICES.forEach(d=>{
    if(!d.zone_name) return;                 // в зоны входят лишь пожарные извещатели
    const el=document.getElementById(d.id);
    if(!el || el.classList.contains('hidden')) return;
    if(zoneHit(z, d.x, d.y)){ el.classList.add('zhi'); n++;
      names[d.zone_name]=(names[d.zone_name]||0)+1; }
  });
  let nm='', best=0;
  for(const k in names){ if(names[k]>best){ best=names[k]; nm=k; } }
  const info=document.getElementById('zinfo');
  info.textContent = (nm || 'Зона') + ' — ' + n + ' шт.';
  info.style.display='block';
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
function dist2(){ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
function mid2(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }
svg.addEventListener('wheel', e=>{
  e.preventDefault(); const sp=toSvg(e.clientX,e.clientY);
  zoomAt(sp.x, sp.y, e.deltaY>0 ? 1.15 : 1/1.15);
}, {passive:false});

document.getElementById('zin').onclick = ()=>zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1/1.4);
document.getElementById('zout').onclick = ()=>zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1.4);
// ⤢ «весь план» = выход из режима обхода: масштаб обхода забываем, следующий
// ▶ снова приблизит по умолчанию.
document.getElementById('zfit').onclick = ()=>{
  pulseG.classList.remove('on'); navZoomW = null; animateTo({...HOME}, 350);
};

// ── Кнопки обхода: посередине свободного места СВОЕЙ строки ────────
// Строку задаёт CSS (внизу плана либо в шапке карточки), горизонталь считаем
// здесь: берём преграды, которые эту строку пересекают (колонка зума, адрес,
// крестик), находим самый широкий свободный промежуток и встаём в его центр.
// Измерять надо каждый раз: ширина экрана, поворот телефона и длина адреса
// двигают преграды.
function placeNav(){
  const nb = document.getElementById('navbtns');
  const host = nb.offsetParent || wrap;
  nb.style.left = '0px';
  const hostR = host.getBoundingClientRect(), nbR = nb.getBoundingClientRect();
  const pad = 8, w = nbR.width;
  const blocks = [];
  // Преграда — то, что ВИДНО, а не коробка элемента: <div> с адресом растянут на
  // всю ширину карточки, хотя текста в нём на 60 px. Меряем содержимое Range'ом,
  // иначе «свободного места нет» и кнопки уезжают в центр поверх адреса.
  const boxOf = el => {
    try {
      const rg = document.createRange(); rg.selectNodeContents(el);
      const r = rg.getBoundingClientRect();
      if(r.width && r.height) return r;
    } catch(e){}
    return el.getBoundingClientRect();
  };
  ['zoombtns','cAddr','cGrid','cardClose','zinfo'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el || el === nb || nb.contains(el)) return;
    // Кнопки в карточке спорят только с содержимым карточки: колонка зума в этот
    // момент лежит ПОД ней и преградой не является.
    if(host !== wrap && !host.contains(el)) return;
    const r = boxOf(el);
    if(!r.width || !r.height) return;
    // «На этой строке» = перекрытие по вертикали заметное, а не касание краем:
    // таблица карточки задевает строку кнопок на 9 px и съедала всё место.
    const ov = Math.min(r.bottom, nbR.bottom) - Math.max(r.top, nbR.top);
    if(ov < nbR.height * 0.4) return;
    if(r.right <= hostR.left || r.left >= hostR.right) return;     // не в этом контейнере
    blocks.push({l: Math.max(r.left, hostR.left), r: Math.min(r.right, hostR.right)});
  });
  blocks.sort((a,b)=>a.l-b.l);
  let cur = hostR.left + pad, best = null;
  const consider = (l,r)=>{ if(r-l >= w && (!best || r-l > best.r-best.l)) best = {l,r}; };
  blocks.forEach(b=>{ if(b.l - pad > cur) consider(cur, b.l - pad); cur = Math.max(cur, b.r + pad); });
  consider(cur, hostR.right - pad);
  let left = best ? (best.l + best.r)/2 - w/2 - hostR.left : (hostR.width - w)/2;
  nb.style.left = Math.max(pad, Math.min(left, hostR.width - w - pad)) + 'px';
}
const relayoutNav = ()=>requestAnimationFrame(placeNav);
window.addEventListener('resize', relayoutNav);
window.addEventListener('orientationchange', relayoutNav);
document.addEventListener('fullscreenchange', relayoutNav);

buildFilters(); buildLegend(); applyDone(); relayoutNav();
</script>
