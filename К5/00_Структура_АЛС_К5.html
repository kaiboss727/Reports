  .pmap span { color:#7a6a3a; font-size:14px; }
  .chip .loc { font-size:0.82em; opacity:.75; font-weight:600; }
  :root { --bg:#fff; --fg:#111; --mut:#667; --line:#d8dde3; --head:#f2f5f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e8ecef; --mut:#95a1ad; --line:#2c3238; --head:#1c2126; }
  }
  * { box-sizing:border-box; }

         font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  h1 { font-size:20px; margin:0 0 14px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:280px; }
  th,td { padding:12px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th { background:var(--head); font-size:13px; text-transform:uppercase;
       letter-spacing:.04em; color:var(--mut); position:sticky; top:0; }
  .fl { font-weight:700; width:22%; font-variant-numeric:tabular-nums; }
  .chip { display:inline-block; min-width:66px; padding:7px 12px; border-radius:8px;
          border:1px solid transparent; font-weight:700; font-size:17px;
          font-variant-numeric:tabular-nums; text-align:center; }
  .chip.none { background:transparent; color:var(--mut); border-color:var(--line);

  tr:last-child td { border-bottom:none; }
