<style>  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #panel:not(.progopen) #progrow { display:none; }
  #card .addr { border-bottom:1px dotted #6b8; padding-bottom:1px; display:inline-block; }
  #card .head { cursor:pointer; }
  #cIcoWrap { position:relative; flex:0 0 auto; }
  #cIcoWrap .pen { position:absolute; right:-3px; bottom:-4px; font-size:12px; line-height:1;

  #card textarea { display:none; }
  #card.noteopen textarea { display:block; }
  #progrow { display:flex; align-items:center; gap:8px; margin-top:6px; }
  #progwrap { flex:1; height:8px; background:#15151a; border-radius:4px; overflow:hidden; }

  #filters.open { display:block; }

  .chip.on { background:#2d6cdf; border-color:#2d6cdf; color:#fff; }
  #legend { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:12px; color:#bbb; }

  #legend svg { display:block; }
  #stagewrap { flex:1; position:relative; background:#0f0f12; overflow:hidden; }
  #stage { width:100%; height:100%; touch-action:none; display:block; }

  .dev.zhi .ico { stroke:#ffd400; stroke-width:4; }

document.getElementById('exportbtn').onclick = function(){

function saveAsFile(text, fname){

let toastT=null;

function step(delta){

  let i = navIdx<0 ? (delta>0 ? -1 : 0) : navIdx;
  for(let n=0; n<ORDER.length; n++){
    i = (i + delta + ORDER.length) % ORDER.length;

const FIELDS = [['type','Тип'],['panel_line','Прибор.линия']];

const built = {type:false, panel_line:false};
function buildFilters(){
  const host = document.getElementById('fgroups');
  host.innerHTML = '<div class="fcount">Устройств на этаже: ' + DEVICES.length + '</div>';
  FIELDS.forEach(([f,label])=>{
    const vals = [...new Set(DEVICES.map(d=>d[f]).filter(v=>v!==''&&v!=null))]
      .sort((a,b)=>(''+a).localeCompare(''+b,'ru',{numeric:true}));
    if(vals.length<=1) return;
    built[f] = true;
    vals.forEach(v=>active[f].add(v));
    const g=document.createElement('div'); g.className='fgroup';
    g.innerHTML='<h4>'+label+'</h4>';
    const chips=document.createElement('div'); chips.className='chips';
    vals.forEach(v=>{
      const c=document.createElement('span'); c.className='chip on';
      c.textContent = (f==='panel_line') ? chipLabel(v) : v;
      c.dataset.v=v;
      c.onclick=()=>{ if(c._long){ c._long=false; return; }
        c.classList.toggle('on');
        if(c.classList.contains('on')) active[f].add(v); else active[f].delete(v);
        applyFilters(); };
      let t=null;
      const start=()=>{ c._long=false; t=setTimeout(()=>{ c._long=true;
        soloOrAll(f, v, chips); if(navigator.vibrate) navigator.vibrate(30); }, 600); };
      const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
      c.addEventListener('pointerdown', start);
      c.addEventListener('pointerup', cancel);
      c.addEventListener('pointerleave', cancel);
      c.addEventListener('pointercancel', cancel);
      chips.appendChild(c);
    });

  });
}
function isHidden(id){ return document.getElementById(id).classList.contains('hidden'); }
function applyFilters(){
  DEVICES.forEach(d=>{
    const el=document.getElementById(d.id);
    const ok = FIELDS.every(([f])=>{
      if(!built[f]) return true;
      if(active[f].size===0) return false;
      const v = d[f];
      if(v===''||v==null) return true;
      return active[f].has(v);
    });
    el.classList.toggle('hidden', !ok);
  });
}
function soloOrAll(f, v, group){
  const isSolo = active[f].size===1 && active[f].has(v);
  active[f].clear();
  if(isSolo){ group.querySelectorAll('.chip').forEach(ch=>active[f].add(ch.dataset.v)); }
  else { active[f].add(v); }
  group.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('on', active[f].has(ch.dataset.v)));
  applyFilters();
}
function buildLegend(){

  const cnt = {};
  DEVICES.forEach(d=>{ const t=d.type||''; const nm=names.find(n=>t.indexOf(n)>=0);

    const shape = e.square
      ? '<rect x="1" y="1" width="14" height="14" fill="'+e.color+'" stroke="#000"/>'
      : '<circle cx="8" cy="8" r="7" fill="'+e.color+'" stroke="#000"/>';
    return '<span class="li"><svg width="16" height="16">'+shape
      +'<text x="8" y="8" font-family="Arial" font-size="'+(e.symbol.length>1?7:9)+'" fill="'+e.symbol_fill+'" text-anchor="middle" dominant-baseline="central">'
      +e.symbol+'</text></svg>'+e.name+' — <b>'+(cnt[e.name]||0)+'</b> шт.</span>';

}

function fsOn(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsToggle(){
  const el = document.documentElement;
  if(fsOn()){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(ex) ex.call(document);
    fsSync(); return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req){ toast('Полный экран на iPhone недоступен — ограничение Safari'); return; }
  const p = req.call(el);
  if(p && p.catch) p.catch(function(){ toast('Браузер не отдал полный экран'); });
  fsSync();
}

(function(){

function panelSystem(){
  var APS_ONLY = /^(ИП |ИПР)/, SPA_ONLY = /^(МДУ|УДП)/;
  var seen = {};
  for(var d of DEVICES){
    var p = String(d.panel||''); if(!p) continue;
    var t = String(d.type||'');
    if(APS_ONLY.test(t)) (seen[p] = seen[p] || new Set()).add('АПС');
    else if(SPA_ONLY.test(t)) (seen[p] = seen[p] || new Set()).add('СПА');
  }
  var out = {};
  for(var q in seen){ var s=[...seen[q]]; if(s.length===1) out[q]=s[0]; }
  return out;
}
var _PSYS = null;
function chipLabel(v){
  if(!_PSYS) _PSYS = panelSystem();
  var p = String(v).split('.')[0];
  var out = v;
  var sys = _PSYS[p];
  if(sys) out += ' · ' + sys;
  var org = PANEL_ORIGIN[p];
  if(org) out += ' · в проекте ARK' + org;

}
const pts = new Map();
let lastDist=0, moved=false, downXY=null, downT=0;
svg.addEventListener('pointerdown', e=>{
  e.preventDefault();
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===1){ moved=false; downXY={x:e.clientX,y:e.clientY}; downT=Date.now(); }
  if(pts.size===2){ lastDist = dist2(); }
});
svg.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===1){
    const k = vbGeom().k;
    vb.x -= (e.clientX-prev.x) * k;
    vb.y -= (e.clientY-prev.y) * k;
    applyVB();
    if(downXY && Math.hypot(e.clientX-downXY.x, e.clientY-downXY.y)>12) moved=true;
  } else if(pts.size===2){
    const d = dist2(); if(lastDist>0){
      const m = mid2(); const sp = toSvg(m.x, m.y);
      zoomAt(sp.x, sp.y, lastDist/d);
    }
    lastDist = d; moved=true;
  }
});
function endPtr(e){
  if(pts.size===1 && !moved && Date.now()-downT<500){
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const g = t && t.closest ? t.closest('.dev') : null;
    if(g && !g.classList.contains('hidden')){ select(g.id); }
    else { selectZone(t && t.closest ? t.closest('.zone') : null); }
  }
  pts.delete(e.pointerId);
  if(pts.size<2) lastDist=0;
}
let curZone = null;
function clearZone(){
  document.querySelectorAll('.zone.zsel').forEach(el=>el.classList.remove('zsel'));
  document.querySelectorAll('.dev.zhi').forEach(el=>el.classList.remove('zhi'));
  document.getElementById('zinfo').style.display='none';
  curZone = null;
}
function ptInPoly(x, y, pts){
  let inside=false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function zoneHit(z, x, y){
  if(z.tagName.toLowerCase()==='rect'){
    const rx=+z.getAttribute('x'), ry=+z.getAttribute('y');
    return x>=rx && x<=rx+ (+z.getAttribute('width')) && y>=ry && y<=ry+ (+z.getAttribute('height'));
  }
  const pts=(z.getAttribute('points')||'').trim().split(/\s+/).map(p=>p.split(',').map(Number));
  return ptInPoly(x, y, pts);
}
function selectZone(z){
  if(!z){ clearZone(); return; }
  if(curZone===z){ clearZone(); return; }
  clearZone(); curZone = z;
  z.classList.add('zsel');
  let n=0; const names={};
  DEVICES.forEach(d=>{
    if(!d.zone_name) return;
    const el=document.getElementById(d.id);
    if(!el || el.classList.contains('hidden')) return;
    if(zoneHit(z, d.x, d.y)){ el.classList.add('zhi'); n++;
      names[d.zone_name]=(names[d.zone_name]||0)+1; }
  });
  let nm='', best=0;
  for(const k in names){ if(names[k]>best){ best=names[k]; nm=k; } }
  const info=document.getElementById('zinfo');
  info.textContent = (nm || 'Зона') + ' — ' + n + ' шт.';
  info.style.display='block';
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
function dist2(){ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
function mid2(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }
svg.addEventListener('wheel', e=>{
  e.preventDefault(); const sp=toSvg(e.clientX,e.clientY);
  zoomAt(sp.x, sp.y, e.deltaY>0 ? 1.15 : 1/1.15);
}, {passive:false});

};
function placeNav(){
  const nb = document.getElementById('navbtns');
  const host = nb.offsetParent || wrap;
  nb.style.left = '0px';
  const hostR = host.getBoundingClientRect(), nbR = nb.getBoundingClientRect();
  const pad = 8, w = nbR.width;
  const blocks = [];
  const boxOf = el => {
    try {
      const rg = document.createRange(); rg.selectNodeContents(el);
      const r = rg.getBoundingClientRect();
      if(r.width && r.height) return r;
    } catch(e){}
    return el.getBoundingClientRect();
  };
  ['zoombtns','cAddr','cardClose','zinfo'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el || el === nb || nb.contains(el)) return;
    if(host !== wrap && !host.contains(el)) return;
    const r = boxOf(el);
    if(!r.width || !r.height) return;
    const ov = Math.min(r.bottom, nbR.bottom) - Math.max(r.top, nbR.top);
    if(ov < nbR.height * 0.4) return;
    if(r.right <= hostR.left || r.left >= hostR.right) return;
    blocks.push({l: Math.max(r.left, hostR.left), r: Math.min(r.right, hostR.right)});
  });
  blocks.sort((a,b)=>a.l-b.l);
  let cur = hostR.left + pad, best = null;
  const consider = (l,r)=>{ if(r-l >= w && (!best || r-l > best.r-best.l)) best = {l,r}; };
  blocks.forEach(b=>{ if(b.l - pad > cur) consider(cur, b.l - pad); cur = Math.max(cur, b.r + pad); });
  consider(cur, hostR.right - pad);
  let left = nb.classList.contains('incard')
    ? (hostR.width - w)/2
    : (best ? (best.l + best.r)/2 - w/2 - hostR.left : (hostR.width - w)/2);
  nb.style.left = Math.max(pad, Math.min(left, hostR.width - w - pad)) + 'px';
}
const relayoutNav = ()=>requestAnimationFrame(placeNav);
window.addEventListener('resize', relayoutNav);
window.addEventListener('orientationchange', relayoutNav);
document.addEventListener('fullscreenchange', relayoutNav);
