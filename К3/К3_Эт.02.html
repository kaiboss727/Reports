<title>К3_Эт.2</title>
<style>  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, Arial, sans-serif; background:#1b1b1f; color:#eee; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #search { user-select:text; -webkit-user-select:text; }
  #app { display:flex; flex-direction:column; height:100%; }
  #panel { flex:0 0 auto; background:#26262bE6; border-bottom:1px solid #0008; padding:3px 8px; }
  #panel .row { min-height:0; }
  #panel .row button.act { padding:6px 10px; }
  #panel .row #gobtn, #panel .row #progbtn, #panel .row #fsbtn { padding:6px 10px; }
  #progrow { margin-top:4px; margin-bottom:2px; }
  #panel .row { display:flex; gap:8px; align-items:center; }
  #title { font-size:19px; font-weight:700; color:#ff7676; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #panel:not(.searchopen) #search { display:none; }
  #panel:not(.progopen) #progrow { display:none; }
  #card .addr { border-bottom:1px dotted #6b8; padding-bottom:1px; display:inline-block; }
  #card .head { cursor:pointer; }
  #cIcoWrap { position:relative; flex:0 0 auto; }
  #cIcoWrap .pen { position:absolute; right:-3px; bottom:-4px; font-size:12px; line-height:1;
    background:#26262b; border:1px solid #666; border-radius:50%; padding:2px 3px; color:#9fb6c9; }
  #cIcoWrap.hasnote .pen { color:#ffd479; border-color:#ffd479; }
  .fcount { font-size:12px; color:#9aa; margin:2px 0 6px; }
  #fbtn { animation:filtglow 20s ease-in-out infinite; animation-delay:10s; }
  #fbtn.on { animation:none; }
  @keyframes filtglow { 0%,6%,100% { background:#3a3a42; box-shadow:0 0 0 0 rgba(90,170,255,0); }
                        3%         { background:#2b4a6b; box-shadow:0 0 12px 2px rgba(90,170,255,.5); } }
  #panel.searchopen #title { display:none; }
  #card .head { display:flex; align-items:center; gap:10px; padding-right:0; }
  #card .head svg { flex:0 0 auto; }
  #card .ht { min-width:0; }
  #card .model { font-size:13px; color:#9fb6c9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #card textarea { display:none; }
  #card.noteopen textarea { display:block; }
  #progrow { display:flex; align-items:center; gap:8px; margin-top:6px; }
  #progwrap { flex:1; height:8px; background:#15151a; border-radius:4px; overflow:hidden; }
  #progbar { height:100%; width:0; background:#22c55e; transition:width .2s; }
  #prog { font-size:13px; color:#bcd; white-space:nowrap; }
  #progrow button.act { padding:5px 9px; font-size:14px; }
  #search { flex:1; font-size:17px; padding:9px 12px; border-radius:8px; border:1px solid #555; background:#15151a; color:#fff; min-width:0; }
  #search::placeholder { color:#888; }
  button.act { font-size:15px; padding:9px 12px; border-radius:8px; border:1px solid #555; background:#3a3a42; color:#fff; }
  button.act:active { background:#50505a; }
  button.act.on { background:#2d6cdf; border-color:#2d6cdf; }
  #devs.nolabels .lbl { display:none; }
  #filters { display:none; margin-top:8px; max-height:42vh; overflow:auto; }
  #filters.open { display:block; }
  .fgroup { margin:6px 0; }
  .fgroup h4 { margin:4px 0; font-size:12px; color:#9aa; text-transform:uppercase; letter-spacing:.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:13px; padding:5px 10px; border-radius:14px; border:1px solid #555; background:#15151a; color:#ccc; user-select:none; }
  .chip.on { background:#2d6cdf; border-color:#2d6cdf; color:#fff; }
  #legend { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:12px; color:#bbb; }
  #legend .li { display:flex; align-items:center; gap:4px; }
  #legend svg { display:block; }
  #stagewrap { flex:1; position:relative; background:#0f0f12; overflow:hidden; }
  #stage { width:100%; height:100%; touch-action:none; display:block; }
  .zone { cursor:pointer; }
  .zone:hover { fill:rgba(0,200,0,0.55); stroke:#ffd400; stroke-width:5; }
  .zone.zsel { fill:rgba(0,200,0,0.6); stroke:#ff2d2d; stroke-width:5; }
  .dev.zhi .ico { stroke:#ffd400; stroke-width:4; }
  #zinfo { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:#0a7d33ee; color:#fff; padding:7px 14px; border-radius:8px; font-size:14px; font-weight:600; display:none; max-width:90%; box-shadow:0 2px 10px #0008; }
  .chip:active { transform:scale(.94); }
  .dev .ico { cursor:pointer; }
  .dev.dim { opacity:.12; }
  .dev.hidden { display:none; }
  .dev.done .ico { stroke:#22c55e; stroke-width:4; }
  #devs.hidedone .dev.done { display:none; }
  .dev.sel .ico { stroke:#ff2d2d; stroke-width:4; }
  .pulse { fill:none; stroke:#ff2d2d; stroke-width:5; transform-box:fill-box; transform-origin:center; }
  #pulseG { pointer-events:none; display:none; }
  #pulseG.on { display:block; }
  #pulseG.on .pulse { animation:pulse 1.1s ease-out infinite; }

  #card { position:absolute; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); background:#26262bF2; border:1px solid #444; border-radius:12px; padding:60px 12px 12px; display:none; box-shadow:0 4px 20px #000a; }

  #card .addr { font-size:18px; flex:0 0 auto; }
  #card .model { flex:1 1 auto; min-width:0; font-size:15px; color:#e6eef6; font-weight:500; }
  #card #cDone { flex:0 0 auto; width:46px; height:46px; min-width:0; max-width:none; margin:0;
    padding:0; border-radius:50%; font-size:24px; line-height:1; display:flex; align-items:center;
    justify-content:center; color:#8a8f96; background:#33333b; border:1px solid #555; }
  #card #cDone.done { background:#1f9d55; border-color:#1f9d55; color:#fff; }
  #card.show { display:block; }
  #card .addr { font-size:20px; font-weight:700; color:#fff; }
  #card textarea { width:100%; margin-top:8px; min-height:42px; background:#15151a; color:#fff; border:1px solid #555; border-radius:8px; padding:8px 10px; font-size:14px; resize:vertical; box-sizing:border-box; }
  #panel .row button.act { padding:8px 10px; font-size:14px; }
  #panel .row #gobtn, #panel .row #progbtn, #panel .row #fsbtn { padding:8px 11px; }
  #title { flex:1 1 auto; min-width:0; }
  #card .head { padding-right:8px; }
  #card .addr { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #filters .fline { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #filters .fline .act { font-size:13px; padding:6px 10px; }
  @media (orientation:landscape){
    #card { padding:6px 96px 6px 10px; bottom:6px; }
    #card .close { top:50%; transform:translateY(-50%); right:2px; width:42px; height:42px; font-size:32px; }
    #card #cDone { position:absolute; top:50%; right:46px; transform:translateY(-50%);

    #card .head { padding-right:0; }
    #card .ht { max-width:calc(50% - 90px); }
    #navbtns.incard { top:50%; transform:translateY(-50%); }
    #card textarea { margin-top:6px; }

  #card .close { position:absolute; top:4px; right:6px; width:48px; height:48px; display:flex;

    font-weight:700; cursor:pointer; }
  #card .close:active { color:#ff7a7a; }
  #toast { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:#a33; color:#fff;

  #zoombtns { position:absolute; right:10px; bottom:90px; display:flex; flex-direction:column; gap:6px; }
  #navbtns { position:absolute; z-index:6; display:flex; flex-direction:row; gap:6px; }
  #navbtns.float { bottom:16px; }
  #navbtns.incard { top:10px; }
  #zoombtns button, #navbtns button { width:44px; height:44px; font-size:24px; border-radius:50%; border:1px solid #555; background:#26262bD0; color:#fff; }

    transform:translateX(-130%); animation:navshine 20s ease-in-out infinite; }
  @keyframes navglow { 0%,6%,100% { background:#26262bD0; box-shadow:0 0 0 0 rgba(90,170,255,0); }

      c.textContent = (f==='panel_line') ? chipLabel(v) : v;
      c.dataset.v=v;
      c.onclick=()=>{ if(c._long){ c._long=false; return; }
        c.classList.toggle('on');
        if(c.classList.contains('on')) active[f].add(v); else active[f].delete(v);
        applyFilters(); };
      let t=null;
      const start=()=>{ c._long=false; t=setTimeout(()=>{ c._long=true;
        soloOrAll(f, v, chips); if(navigator.vibrate) navigator.vibrate(30); }, 600); };
      const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
      c.addEventListener('pointerdown', start);
      c.addEventListener('pointerup', cancel);
      c.addEventListener('pointerleave', cancel);
      c.addEventListener('pointercancel', cancel);
      chips.appendChild(c);
    });
    g.appendChild(chips); host.appendChild(g);
  });
}
function isHidden(id){ return document.getElementById(id).classList.contains('hidden'); }
function applyFilters(){
  DEVICES.forEach(d=>{
    const el=document.getElementById(d.id);
    const ok = FIELDS.every(([f])=>{
      if(!built[f]) return true;
      if(active[f].size===0) return false;
      const v = d[f];
      if(v===''||v==null) return true;
      return active[f].has(v);
    });
    el.classList.toggle('hidden', !ok);
  });
}
function soloOrAll(f, v, group){
  const isSolo = active[f].size===1 && active[f].has(v);
  active[f].clear();
  if(isSolo){ group.querySelectorAll('.chip').forEach(ch=>active[f].add(ch.dataset.v)); }
  else { active[f].add(v); }
  group.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('on', active[f].has(ch.dataset.v)));
  applyFilters();
}
function buildLegend(){
  const names = LEGEND.map(e=>e.name).sort((a,b)=>b.length-a.length);
  const cnt = {};
  DEVICES.forEach(d=>{ const t=d.type||''; const nm=names.find(n=>t.indexOf(n)>=0);
    if(nm) cnt[nm]=(cnt[nm]||0)+1; });
  document.getElementById('legend').innerHTML = LEGEND.map(e=>{
    const shape = e.square
      ? '<rect x="1" y="1" width="14" height="14" fill="'+e.color+'" stroke="#000"/>'
      : '<circle cx="8" cy="8" r="7" fill="'+e.color+'" stroke="#000"/>';
    return '<span class="li"><svg width="16" height="16">'+shape
      +'<text x="8" y="8" font-family="Arial" font-size="'+(e.symbol.length>1?7:9)+'" fill="'+e.symbol_fill+'" text-anchor="middle" dominant-baseline="central">'
      +e.symbol+'</text></svg>'+e.name+' — <b>'+(cnt[e.name]||0)+'</b> шт.</span>';
  }).join('');
}
document.getElementById('fbtn').onclick = function(){

function fsOn(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsToggle(){
  const el = document.documentElement;
  if(fsOn()){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(ex) ex.call(document);
    fsSync(); return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req){ toast('Полный экран на iPhone недоступен — ограничение Safari'); return; }
  const p = req.call(el);
  if(p && p.catch) p.catch(function(){ toast('Браузер не отдал полный экран'); });
  fsSync();
}
document.addEventListener('fullscreenchange', fsSync);
function fsSync(){
  const b = document.getElementById('fsbtn');
  if(b) b.classList.toggle('on', fsOn());
  if(typeof relayoutNav === 'function') relayoutNav();
}

document.getElementById('cAddr').onclick = function(){

  const mo = document.getElementById('cModel');

document.getElementById('progbtn').onclick = function(){

};
(function(){
  const t = document.getElementById('title');
  if(t) t.textContent = String(FLOOR||'').replace(/[_]+/g,' · ');
})();
function panelSystem(){
  var APS_ONLY = /^(ИП |ИПР)/, SPA_ONLY = /^(МДУ|УДП)/;
  var seen = {};
  for(var d of DEVICES){
    var p = String(d.panel||''); if(!p) continue;
    var t = String(d.type||'');
    if(APS_ONLY.test(t)) (seen[p] = seen[p] || new Set()).add('АПС');
    else if(SPA_ONLY.test(t)) (seen[p] = seen[p] || new Set()).add('СПА');
  }
  var out = {};
  for(var q in seen){ var s=[...seen[q]]; if(s.length===1) out[q]=s[0]; }
  return out;
}
var _PSYS = null;
function chipLabel(v){
  if(!_PSYS) _PSYS = panelSystem();
  var p = String(v).split('.')[0];
  var out = v;
  var sys = _PSYS[p];
  if(sys) out += ' · ' + sys;
  var org = PANEL_ORIGIN[p];
  if(org) out += ' · в проекте ARK' + org;
  return out;
}
const pts = new Map();
let lastDist=0, moved=false, downXY=null, downT=0;
svg.addEventListener('pointerdown', e=>{
  e.preventDefault();
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===1){ moved=false; downXY={x:e.clientX,y:e.clientY}; downT=Date.now(); }
  if(pts.size===2){ lastDist = dist2(); }
});
svg.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===1){
    const k = vbGeom().k;
    vb.x -= (e.clientX-prev.x) * k;
    vb.y -= (e.clientY-prev.y) * k;
    applyVB();
    if(downXY && Math.hypot(e.clientX-downXY.x, e.clientY-downXY.y)>12) moved=true;
  } else if(pts.size===2){
    const d = dist2(); if(lastDist>0){
      const m = mid2(); const sp = toSvg(m.x, m.y);
      zoomAt(sp.x, sp.y, lastDist/d);
    }
    lastDist = d; moved=true;
  }
});
function endPtr(e){
  if(pts.size===1 && !moved && Date.now()-downT<500){
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const g = t && t.closest ? t.closest('.dev') : null;
    if(g && !g.classList.contains('hidden')){ select(g.id); }
    else { selectZone(t && t.closest ? t.closest('.zone') : null); }
  }
  pts.delete(e.pointerId);
  if(pts.size<2) lastDist=0;
}
let curZone = null;
function clearZone(){
  document.querySelectorAll('.zone.zsel').forEach(el=>el.classList.remove('zsel'));
  document.querySelectorAll('.dev.zhi').forEach(el=>el.classList.remove('zhi'));
  document.getElementById('zinfo').style.display='none';
  curZone = null;
}
function ptInPoly(x, y, pts){
  let inside=false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function zoneHit(z, x, y){
  if(z.tagName.toLowerCase()==='rect'){
    const rx=+z.getAttribute('x'), ry=+z.getAttribute('y');
    return x>=rx && x<=rx+ (+z.getAttribute('width')) && y>=ry && y<=ry+ (+z.getAttribute('height'));
  }
  const pts=(z.getAttribute('points')||'').trim().split(/\s+/).map(p=>p.split(',').map(Number));
  return ptInPoly(x, y, pts);
}
function selectZone(z){
  if(!z){ clearZone(); return; }
  if(curZone===z){ clearZone(); return; }
  clearZone(); curZone = z;
  z.classList.add('zsel');
  let n=0; const names={};
  DEVICES.forEach(d=>{
    if(!d.zone_name) return;
    const el=document.getElementById(d.id);
    if(!el || el.classList.contains('hidden')) return;
    if(zoneHit(z, d.x, d.y)){ el.classList.add('zhi'); n++;
      names[d.zone_name]=(names[d.zone_name]||0)+1; }
  });
  let nm='', best=0;
  for(const k in names){ if(names[k]>best){ best=names[k]; nm=k; } }
  const info=document.getElementById('zinfo');
  info.textContent = (nm || 'Зона') + ' — ' + n + ' шт.';
  info.style.display='block';
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
function dist2(){ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
function mid2(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }
svg.addEventListener('wheel', e=>{
  e.preventDefault(); const sp=toSvg(e.clientX,e.clientY);
  zoomAt(sp.x, sp.y, e.deltaY>0 ? 1.15 : 1/1.15);
}, {passive:false});
document.getElementById('zin').onclick = ()=>zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1/1.4);
document.getElementById('zout').onclick = ()=>zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1.4);
document.getElementById('zfit').onclick = ()=>{
  pulseG.classList.remove('on'); navZoomW = null; animateTo({...HOME}, 350);
};
function placeNav(){
  const nb = document.getElementById('navbtns');
  const host = nb.offsetParent || wrap;
  nb.style.left = '0px';
  const hostR = host.getBoundingClientRect(), nbR = nb.getBoundingClientRect();
  const pad = 8, w = nbR.width;
  const blocks = [];
  const boxOf = el => {
    try {
      const rg = document.createRange(); rg.selectNodeContents(el);
      const r = rg.getBoundingClientRect();
      if(r.width && r.height) return r;
    } catch(e){}
    return el.getBoundingClientRect();
  };
  ['zoombtns','cAddr','cardClose','zinfo'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el || el === nb || nb.contains(el)) return;
    if(host !== wrap && !host.contains(el)) return;
    const r = boxOf(el);
    if(!r.width || !r.height) return;
    const ov = Math.min(r.bottom, nbR.bottom) - Math.max(r.top, nbR.top);
    if(ov < nbR.height * 0.4) return;
    if(r.right <= hostR.left || r.left >= hostR.right) return;
    blocks.push({l: Math.max(r.left, hostR.left), r: Math.min(r.right, hostR.right)});
  });
  blocks.sort((a,b)=>a.l-b.l);
  let cur = hostR.left + pad, best = null;
  const consider = (l,r)=>{ if(r-l >= w && (!best || r-l > best.r-best.l)) best = {l,r}; };
  blocks.forEach(b=>{ if(b.l - pad > cur) consider(cur, b.l - pad); cur = Math.max(cur, b.r + pad); });
  consider(cur, hostR.right - pad);
  let left = nb.classList.contains('incard')
    ? (hostR.width - w)/2
    : (best ? (best.l + best.r)/2 - w/2 - hostR.left : (hostR.width - w)/2);
  nb.style.left = Math.max(pad, Math.min(left, hostR.width - w - pad)) + 'px';
}
const relayoutNav = ()=>requestAnimationFrame(placeNav);
window.addEventListener('resize', relayoutNav);
window.addEventListener('orientationchange', relayoutNav);
document.addEventListener('fullscreenchange', relayoutNav);
buildFilters(); buildLegend(); applyDone(); relayoutNav();</script>
